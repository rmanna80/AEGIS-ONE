repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend)
        entry: mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: gazebo-world-in-sync
        name: Gazebo world matches scenario
        entry: bash -c 'python scripts/generate_gazebo_world.py simulation/scenarios/*.json'
        language: system
        pass_filenames: false
        files: ^simulation/scenarios/
