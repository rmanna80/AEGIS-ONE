[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-one"
version = "0.1.0"
description = "AEGIS ONE - simulation-first autonomous drone research platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    # gRPC-based MAVSDK-Python. The PyPI name "mavsdk" switched to a new native
    # binding with a different API at v4; "mavsdk-grpc" is the maintained
    # continuation of the API this project uses.
    "mavsdk-grpc>=4.0,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["aegis*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["backend/tests"]
markers = [
    "sitl: needs a running PX4 SITL instance (skipped unless AEGIS_SITL_TESTS=1)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "backend/tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM"]
ignore = ["SIM108"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend/aegis"]

[[tool.mypy.overrides]]
module = ["mavsdk_grpc.*"]
ignore_missing_imports = true
