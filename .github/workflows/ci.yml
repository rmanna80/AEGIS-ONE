name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev,perception]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -v
      - name: Generated Gazebo world is in sync with the scenario
        run: |
          python scripts/generate_gazebo_world.py simulation/scenarios/open_field.json
          git diff --exit-code simulation/gazebo/worlds/

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # PX4 SITL simulation tests are run locally for now (see docs/testing/README.md);
  # building PX4 in CI is tracked in docs/ROADMAP.md.
